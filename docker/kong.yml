_format_version: '3.0'

services:
  - name: supabase-auth
    url: http://supabase-auth:9999
    routes:
      - name: auth-route
        paths:
          - /auth/v1
        strip_path: false

  - name: supabase-storage
    url: http://supabase-storage:5000
    routes:
      - name: storage-route
        paths:
          - /storage/v1
        strip_path: false

  - name: supabase-db
    url: http://supabase-db:5432
    routes:
      - name: db-route
        paths:
          - /rest/v1
        strip_path: false

  - name: n8n
    url: http://n8n:5678
    routes:
      - name: n8n-webhook
        paths:
          - /webhook
        strip_path: true
      - name: n8n-api
        paths:
          - /api/n8n
        strip_path: true

  - name: openclaw
    url: http://openclaw:8080
    routes:
      - name: openclaw-api
        paths:
          - /api/openclaw
        strip_path: true

  - name: opendocs-app
    url: http://opendocs-app:3000
    routes:
      - name: app-route
        paths:
          - /
        strip_path: false

plugins:
  - name: rate-limiting
    config:
      minute: 1000
      policy: local

  - name: cors
    config:
      origins:
        - "*"
      methods:
        - GET
        - POST
        - PUT
        - DELETE
        - PATCH
      headers:
        - Accept
        - Accept-Version
        - Content-Length
        - Content-Type
        - Authorization
