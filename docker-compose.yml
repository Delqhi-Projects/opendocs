version: "3.8"

services:
  supabase-db:
    image: postgres:15
    container_name: opendocs-supabase-db
    restart: unless-stopped
    ports:
      - "${SUPABASE_DB_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
    volumes:
      - supabase-db-data:/var/lib/postgresql/data
    networks:
      - opendocs-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  supabase-kong:
    image: kong:3.0
    container_name: opendocs-supabase-kong
    restart: unless-stopped
    ports:
      - "${SUPABASE_API_PORT:-8000}:8000"
    environment:
      KONG_DATABASE: off
      KONG_DECLARATIVE_CONFIG: /kong/kong.yml
    volumes:
      - ./docker/kong.yml:/kong/kong.yml:ro
    networks:
      - opendocs-network
    depends_on:
      - supabase-db

  supabase-auth:
    image: supabase/gotrue:v2.151.0
    container_name: opendocs-supabase-auth
    restart: unless-stopped
    ports:
      - "${SUPABASE_AUTH_PORT:-9999}:9999"
    environment:
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@supabase-db:5432/postgres
      GOTRUE_SITE_URL: http://localhost:3000
      GOTRUE_JWT_SECRET: ${SUPABASE_JWT_SECRET}
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_EXTERNAL_ANONYMOUS_USERS_ENABLED: "true"
    networks:
      - opendocs-network
    depends_on:
      - supabase-db

  supabase-storage:
    image: supabase/postgres-meta:v0.73.0
    container_name: opendocs-supabase-storage
    restart: unless-stopped
    ports:
      - "${SUPABASE_STORAGE_PORT:-5000}:5000"
    environment:
      PG_META_PORT: 5000
      PG_META_DB_HOST: supabase-db
      PG_META_DB_USER: postgres
      PG_META_DB_PASSWORD: postgres
    networks:
      - opendocs-network
    depends_on:
      - supabase-db

  n8n:
    image: n8nio/n8n:latest
    container_name: opendocs-n8n
    restart: unless-stopped
    ports:
      - "${N8N_PORT:-8058}:5678"
    environment:
      N8N_BASIC_AUTH_ACTIVE: "true"
      N8N_BASIC_AUTH_USER: ${N8N_USER}
      N8N_BASIC_AUTH_PASSWORD: ${N8N_PASSWORD}
      N8N_HOST: localhost
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      WEBHOOK_URL: http://localhost:5678/
      GENERIC_TIMEZONE: Europe/Berlin
      TZ: Europe/Berlin
      EXECUTIONS_DATA_SAVE: "true"
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: 336
    volumes:
      - n8n-data:/home/node/.n8n
      - ./n8n/:/files
    networks:
      - opendocs-network
    depends_on:
      - supabase-db

  redis:
    image: redis:7-alpine
    container_name: opendocs-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    networks:
      - opendocs-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  openclaw:
    image: openclaw/openclaw:latest
    container_name: opendocs-openclaw
    restart: unless-stopped
    ports:
      - "${OPENCLAW_PORT:-8080}:8080"
    environment:
      OPENCLAW_API_KEY: ${OPENCLAW_API_KEY:-demo-key}
      OPENCLAW_WEBHOOK_URL: http://localhost:3000/api/webhooks/openclaw
      DATABASE_URL: postgres://postgres:postgres@supabase-db:5432/postgres
      REDIS_URL: redis://redis:6379
    networks:
      - opendocs-network
    depends_on:
      - supabase-db
      - redis

  opendocs-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: opendocs-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      NODE_ENV: development
      VITE_SUPABASE_URL: http://localhost:8000
      VITE_SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-demo-key}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_KEY:-demo-key}
      N8N_API_URL: http://n8n:5678
      N8N_API_KEY: ${N8N_API_KEY:-demo-key}
      OPENCLAW_API_URL: http://openclaw:8080
      OPENCLAW_API_KEY: ${OPENCLAW_API_KEY:-demo-key}
      REDIS_URL: redis://redis:6379
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    networks:
      - opendocs-network
    depends_on:
      - supabase-db
      - n8n
      - redis
      - openclaw

volumes:
  supabase-db-data:
    driver: local
  n8n-data:
    driver: local
  redis-data:
    driver: local

networks:
  opendocs-network:
    driver: bridge
